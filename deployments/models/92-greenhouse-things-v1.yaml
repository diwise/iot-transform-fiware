# AgriGreenhouse från versionerade värdesevent (things.v1.values).
# Gäller endast den nya källan (match.event). Värden läses via
# values.<propertyId>.*-vägar; konsumenttid är max(values[].observedAt).
# Lufttemperatur bor i AirQualityObserved från mätvärdet, inte här:
# växthusentiteten bär co2/relativ fukt (primära inomhusklimatet).
# Beslutat modellavsteg: co2 behålls i PPM, inte modellens mg/L. UN/CEFACT
# unitCode "59" betyder part per million; ingen fysisk omvandling görs.
# Källans relativa fukt är %RH och omvandlas uttryckligen till modellens 0–1.
rules:
  - match: { kind: thing, event: things.v1.values, type: greenhouse }
    entities:
      - id: "urn:ngsi-ld:AgriGreenhouse:{{id}}"
        type: AgriGreenhouse
        context: "https://raw.githubusercontent.com/smart-data-models/dataModel.Agrifood/master/context.jsonld"
        properties:
          - { target: name, type: Text, field: name, observedAt: none }
          - { target: co2, type: Number, field: values.co2.value, unit: "59", observedAt: "field:values.co2.observedAt", required: true }
          - { target: relativeHumidity, type: Number, field: values.humidity.value, observedAt: "field:values.humidity.observedAt", transform: [{ op: divide, value: 100 }] }
          - { target: alternateName, type: Text, field: alternativeName, observedAt: none }
