# Relationshändelser (things.v1.relations) mappade med samma motor som
# värdesevent. Reglerna avgränsas med match.event + match.relation (+
# match.relationRemoved för bortkoppling) och match.type/subType, så att
# gamla producenter utan typfält aldrig träffar (fail fast i stället för
# tysta felskrivningar eller omsändningsloopar).
#
# Exempel 1 (generellt mönster): rums partOf-länk skrivs som refParent på
# rummets observationsentitet (samma id-mall som 90-room-things-v1.yaml).
# Förälder-entiteten förväntas existera (skapad av egen regel); NGSI-LD
# tolererar dangling-referenser.
#
# Exempel 2 (verifierat scenario växthus+tank): tankens partOf-länk skrivs
# som hasWaterQualityObserved (array enligt modellen) på växthusets
# AgriGreenhouse-entitet (samma id-mall som 92-greenhouse-things-v1.yaml).
# Bortkoppling rensar attributet (1-tank-antagande: hela arrayen rensas).
rules:
  - match: { kind: thing, event: things.v1.relations, relation: partOf, type: room }
    entities:
      - id: "urn:ngsi-ld:IndoorEnvironmentObserved:{{id}}"
        type: IndoorEnvironmentObserved
        properties:
          - { target: refParent, type: Relationship, value: "urn:ngsi-ld:Building:{{relation.to.thingId}}" }
  - match: { kind: thing, event: things.v1.relations, relation: partOf, relationRemoved: true, type: room }
    entities:
      - id: "urn:ngsi-ld:IndoorEnvironmentObserved:{{id}}"
        type: IndoorEnvironmentObserved
        properties: []
        removeAttributes: [refParent]
  - match: { kind: thing, event: things.v1.relations, relation: partOf, type: tank }
    entities:
      - id: "urn:ngsi-ld:AgriGreenhouse:{{relation.to.thingId}}"
        type: AgriGreenhouse
        context: "https://raw.githubusercontent.com/smart-data-models/dataModel.Agrifood/master/context.jsonld"
        properties:
          - { target: hasWaterQualityObserved, type: Relationship, array: true, value: "urn:ngsi-ld:WaterQualityObserved:{{relation.from.thingId}}", required: true }
  - match: { kind: thing, event: things.v1.relations, relation: partOf, relationRemoved: true, type: tank }
    entities:
      - id: "urn:ngsi-ld:AgriGreenhouse:{{relation.to.thingId}}"
        type: AgriGreenhouse
        context: "https://raw.githubusercontent.com/smart-data-models/dataModel.Agrifood/master/context.jsonld"
        properties: []
        removeAttributes: [hasWaterQualityObserved]
