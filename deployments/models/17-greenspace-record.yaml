# GreenspaceRecord (diwise-specifik typ). En regel per objekt; alla skriver
# samma entitets-id och type och mergas.
rules:
  - match: { kind: measurement, object: "urn:oma:lwm2m:ext:3323", env: soil }
    entities:
      - id: "urn:ngsi-ld:GreenspaceRecord:{{id}}"
        type: GreenspaceRecord
        properties:
          - target: soilMoisturePressure
            type: Number
            resource: "5700"
            unit: KPA
            observedAt: header
            observedBy: "urn:ngsi-ld:Device:{{id}}"
            convert: { from: Pa, to: KPA, factor: 0.001 }
          - { target: location, type: Geo, latlon: true }
          - { target: dateObserved, type: DateTime, timestamp: true }
  - match: { kind: measurement, object: "urn:oma:lwm2m:ext:3327", env: soil }
    entities:
      - id: "urn:ngsi-ld:GreenspaceRecord:{{id}}"
        type: GreenspaceRecord
        properties:
          - target: soilMoistureEc
            type: Number
            resource: "5700"
            unit: MHO
            observedAt: header
            observedBy: "urn:ngsi-ld:Device:{{id}}"
          - { target: location, type: Geo, latlon: true }
          - { target: dateObserved, type: DateTime, timestamp: true }
