# Tankens vattenkvalitet från versionerade värdesevent (things.v1.values).
# Gäller endast den nya källan (match.event). WaterQualityObserved har
# inget co2- eller waterLevel-attribut i modellen (v0.0.6): endast
# temperature och pH mappas (modellkonformt). co2/waterLevel lämnas
# omappade medvetet — ingen tyst custom-attribut. required: id, type,
# dateObserved, location.
rules:
  - match: { kind: thing, event: things.v1.values, type: tank }
    entities:
      - id: "urn:ngsi-ld:WaterQualityObserved:{{id}}"
        type: WaterQualityObserved
        properties:
          - { target: name, type: Text, field: name, observedAt: none }
          - { target: alternateName, type: Text, field: alternativeName, observedAt: none }
          - { target: temperature, type: Number, field: values.temperature.value, observedAt: "field:values.temperature.observedAt", required: true }
          - { target: pH, type: Number, field: values.ph.value, observedAt: "field:values.ph.observedAt" }
          - { target: location, type: Geo, field: location, required: true }
          - { target: dateObserved, type: DateTime, timestamp: true, required: true }
