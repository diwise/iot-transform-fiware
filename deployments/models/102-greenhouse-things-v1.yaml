# Växthus från versionerade värdesevent (things.v1.values), saktyp greenhouse.
# En regel ger två entiteter (mönstret från 101-beach):
#   - AgriGreenhouse: rummets tillstånd (co2, relativ fukt) + länkplats för
#     tankarnas vattenkvalitet (hasWaterQualityObserved sätts av
#     relationsregeln i 94, inte här).
#   - IndoorEnvironmentObserved: samma givare i inomhusmiljö-dräkt
#     (temperatur, fukt, ljus, co2) — AgriGreenhouse saknar lufttemperatur-
#     fält (bara leafTemperature) och dailyLight är kW/m2, inte lux.
# Alla värdefält är avsiktligt valfria: en batch bär bara den sändande
# givarens egenskaper (co2+temperatur, fukt respektive ljus var för sig),
# required på värden skulle tysta partiella batchar. location/dateObserved
# är required (Polygon finns på saken, tid stämplas per batch).
rules:
  - match: { kind: thing, event: things.v1.values, type: greenhouse }
    entities:
      - id: "urn:ngsi-ld:AgriGreenhouse:{{id}}"
        type: AgriGreenhouse
        properties:
          - { target: location, type: Geo, field: geometry, required: true }
          - { target: dateObserved, type: DateTime, timestamp: true, required: true }
          - { target: co2, type: Number, field: values.co2.value, observedAt: "field:values.co2.observedAt" }
          - { target: relativeHumidity, type: Number, field: values.humidity.value, observedAt: "field:values.humidity.observedAt" }
          - { target: hasIndoorEnvironmentObserved, type: Relationship, value: "urn:ngsi-ld:IndoorEnvironmentObserved:{{id}}" }
          - { target: name, type: Text, field: name, observedAt: none }
          - { target: alternateName, type: Text, field: alternativeName, observedAt: none }
      - id: "urn:ngsi-ld:IndoorEnvironmentObserved:{{id}}"
        type: IndoorEnvironmentObserved
        properties:
          - { target: location, type: Geo, field: geometry, required: true }
          - { target: dateObserved, type: DateTime, timestamp: true, required: true }
          - { target: temperature, type: Number, field: values.temperature.value, observedAt: "field:values.temperature.observedAt" }
          - { target: relativeHumidity, type: Number, field: values.humidity.value, observedAt: "field:values.humidity.observedAt" }
          - { target: illuminance, type: Number, field: values.illuminance.value, observedAt: "field:values.illuminance.observedAt" }
          - { target: co2, type: Number, field: values.co2.value, observedAt: "field:values.co2.observedAt" }
          - { target: name, type: Text, field: name, observedAt: none }
          - { target: alternateName, type: Text, field: alternativeName, observedAt: none }
