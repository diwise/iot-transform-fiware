# Livscykelhändelser (things.v1.lifecycle) mappade med samma motor som
# värdesevent. Delete-regler raderar NGSI-LD-entiteten idempotent (404 = OK)
# med samma id/typ-mallar som värde-reglerna, så att borttagna saker inte
# lämnar föräldralösa entiteter hos brokern. Reglerna avgränsas med
# match.event + match.lifecycle: deleted + match.type (en regel per mall,
# samma mönster som 90-92 — utan typ skulle första regeln vinna alla
# deletes), så created/updated/värdes/relations-händelser aktiverar dem
# aldrig. properties: [] krävs av OpenAPI-kontraktet.
#
# J2(b): created/updated-regler skapar/uppdaterar beskrivande saker utan nya
# mätningar (deskriptor-bara lifecycle från producentens bootstrap/underlag).
# Samma id/typ-mallar som värde-reglerna (konsistenta mål-ID:n); endast
# deskriptorfält (namn/plats/beskrivning + händelsetid) mappas — inga
# values.*-källor, inga required-flaggor (deskriptor-tolerant skalbild).
# Mätvärdesburna entiteter (t.ex. WeatherObserved/WaterQualityObserved)
# undertrycks inte här utan utelämnas: de skapas vid första värdeseventet.
# Saknad källa är skip (aldrig rensning); merge-semantik.
rules:
  - match: { kind: thing, event: things.v1.lifecycle, lifecycle: created, type: room }
    entities:
      - id: "urn:ngsi-ld:IndoorEnvironmentObserved:{{id}}"
        type: IndoorEnvironmentObserved
        properties:
          - { target: name, type: Text, field: name, observedAt: none }
          - { target: alternateName, type: Text, field: alternativeName, observedAt: none }
          - { target: location, type: Geo, field: geometry }
          - { target: dateObserved, type: DateTime, timestamp: true }
  - match: { kind: thing, event: things.v1.lifecycle, lifecycle: updated, type: room }
    entities:
      - id: "urn:ngsi-ld:IndoorEnvironmentObserved:{{id}}"
        type: IndoorEnvironmentObserved
        properties:
          - { target: name, type: Text, field: name, observedAt: none }
          - { target: alternateName, type: Text, field: alternativeName, observedAt: none }
          - { target: location, type: Geo, field: geometry }
          - { target: dateObserved, type: DateTime, timestamp: true }
  - match: { kind: thing, event: things.v1.lifecycle, lifecycle: created, type: wastebin }
    entities:
      - id: "urn:ngsi-ld:WasteContainer:{{id}}"
        type: WasteContainer
        properties:
          - { target: name, type: Text, field: name, observedAt: none }
          - { target: alternateName, type: Text, field: alternativeName, observedAt: none }
          - { target: location, type: Geo, field: geometry }
          - { target: dateObserved, type: DateTime, timestamp: true }
  - match: { kind: thing, event: things.v1.lifecycle, lifecycle: updated, type: wastebin }
    entities:
      - id: "urn:ngsi-ld:WasteContainer:{{id}}"
