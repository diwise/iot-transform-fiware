# Livscykelhändelser (things.v1.lifecycle) mappade med samma motor som
# värdesevent. Delete-regler raderar NGSI-LD-entiteten idempotent (404 = OK)
# med samma id/typ-mallar som värde-reglerna, så att borttagna saker inte
# lämnar föräldralösa entiteter hos brokern. Reglerna avgränsas med
# match.event + match.lifecycle: deleted + match.type (en regel per mall,
# samma mönster som 90-92 — utan typ skulle första regeln vinna alla
# deletes), så created/updated/värdes/relations-händelser aktiverar dem
# aldrig. properties: [] krävs av OpenAPI-kontraktet.
rules:
  - match: { kind: thing, event: things.v1.lifecycle, lifecycle: deleted, type: room }
    entities:
      - id: "urn:ngsi-ld:IndoorEnvironmentObserved:{{id}}"
        type: IndoorEnvironmentObserved
        properties: []
        delete: true
  - match: { kind: thing, event: things.v1.lifecycle, lifecycle: deleted, type: wastebin }
    entities:
      - id: "urn:ngsi-ld:WasteContainer:{{id}}"
        type: WasteContainer
        properties: []
        delete: true
  - match: { kind: thing, event: things.v1.lifecycle, lifecycle: deleted, type: greenhouse }
    entities:
      - id: "urn:ngsi-ld:AgriGreenhouse:{{id}}"
        type: AgriGreenhouse
        properties: []
        delete: true
  - match: { kind: thing, event: things.v1.lifecycle, lifecycle: deleted, type: tank }
    entities:
      - id: "urn:ngsi-ld:WaterQualityObserved:{{id}}"
        type: WaterQualityObserved
        properties: []
        delete: true
  - match: { kind: thing, event: things.v1.lifecycle, lifecycle: deleted, type: lifebuoy }
    entities:
      - id: "urn:ngsi-ld:Lifebuoy:{{id}}"
        type: Lifebuoy
        properties: []
        delete: true
  - match: { kind: thing, event: things.v1.lifecycle, lifecycle: deleted, type: desk }
    entities:
      - id: "urn:ngsi-ld:Device:{{id}}"
        type: Device
        properties: []
        delete: true
  - match: { kind: thing, event: things.v1.lifecycle, lifecycle: deleted, type: pumpingstation }
    entities:
      - id: "urn:ngsi-ld:SewagePumpingStation:{{id}}"
        type: SewagePumpingStation
        properties: []
        delete: true
  - match: { kind: thing, event: things.v1.lifecycle, lifecycle: deleted, type: sewer }
    entities:
      - id: "urn:ngsi-ld:Sewer:{{id}}"
        type: Sewer
        properties: []
        delete: true
  - match: { kind: thing, event: things.v1.lifecycle, lifecycle: deleted, type: pointofinterest }
    entities:
      - id: "urn:ngsi-ld:PointOfInterest:{{id}}"
        type: PointOfInterest
        properties: []
        delete: true
