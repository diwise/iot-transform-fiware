          - { target: alternateName, type: Text, field: alternativeName, observedAt: none }
          - { target: location, type: Geo, field: geometry }
          - { target: dateObserved, type: DateTime, timestamp: true }
  - match: { kind: thing, event: things.v1.lifecycle, lifecycle: created, type: lifebuoy }
