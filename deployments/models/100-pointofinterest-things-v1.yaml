# PointOfInterest från versionerade värdesevent (things.v1.values).
# Generisk POI-mall: PointOfInterest-entiteten (name/location/description)
# byggs alltid från deskriptorfält. Sakens temperatur (values.temperature,
# kopplad sensor) mappas dessutom till WeatherObserved per sak-ID; saknad
# temperatur undertrycker endast Weather-entiteten (required).
# Beach har egen mall i 101-beach (vinner via subType-specificitet).
rules:
  - match: { kind: thing, event: things.v1.values, type: pointofinterest }
    entities:
      - id: "urn:ngsi-ld:PointOfInterest:{{id}}"
        type: PointOfInterest
        properties:
          - { target: name, type: Text, field: name, observedAt: none, required: true }
          - { target: alternateName, type: Text, field: alternativeName, observedAt: none }
          - { target: description, type: Text, field: metadata.description, observedAt: none }
          - { target: location, type: Geo, field: geometry }
      - id: "urn:ngsi-ld:WeatherObserved:{{id}}"
        type: WeatherObserved
        properties:
          - { target: temperature, type: Number, field: values.temperature.value, observedAt: "field:values.temperature.observedAt", required: true }
          - { target: source, type: Text, field: values.temperature.source, observedAt: none }
          - { target: location, type: Geo, field: geometry, required: true }
          - { target: dateObserved, type: DateTime, timestamp: true, required: true }
